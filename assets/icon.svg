<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- WhisprCatch app icon: a text cursor inside a sound wave. Speech goes in on
       both sides, and lands as typed text where the cursor is. Palette per
       docs/DESIGN.md: slate to charcoal tile, one yellow stroke family. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#393E46"/>
      <stop offset="1" stop-color="#222831"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="#EEEEEE" stroke-opacity="0.10" stroke-width="3"/>
  <g fill="none" stroke="#FFD369" stroke-width="48" stroke-linecap="round">
    <!-- the wave -->
    <path d="M76 222v68M146 180v152M366 180v152M436 222v68"/>
    <!-- the cursor -->
    <path d="M256 116v280M216 116h80M216 396h80"/>
  </g>
</svg>
