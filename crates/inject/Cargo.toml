[package]
name = "wc-inject"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
enigo = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Text is posted via CGEvent so the modifier flags can be set explicitly;
# enigo would inherit the held push-to-talk key and emit shortcuts instead.
core-graphics = "0.25"

