name: Rust

# The app had no automated test run on pull requests: `release-macos.yml` only
# fires on a v* tag, which is far too late to learn a test broke. The text
# cleanup work (issue #36) lands as a long series of PRs against a shared
# crate, so every one of them needs the whole suite run before it merges.
on:
  pull_request:
    paths:
      - '**.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'
  push:
    branches: [main]
    paths:
      - '**.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'

# A new push to the same PR makes the in-flight run pointless.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # a Linux-only failure should not hide a macOS-only one
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Same set the .deb build in release-macos.yml installs.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang libasound2-dev

      - name: Test
        run: cargo test --workspace --all-targets

      # Doc-tests are excluded by --all-targets above, so run them separately.
      - name: Doc tests
        run: cargo test --workspace --doc

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang libasound2-dev

      # The workspace carries pre-existing warnings that predate this workflow,
      # so -D warnings would fail on day one for reasons no PR author caused.
      # Clippy still blocks on genuine errors here.
      - name: Clippy
        run: cargo clippy --workspace --all-targets

      # The repo has never been rustfmt-clean, so formatting is enforced only on
      # crates that are. Add crates here as they are brought up to standard.
      # wc-text arrives with the cleanup seam (#40); the guard lets this
      # workflow merge before that PR does.
      - name: Format (wc-text only)
        run: |
          if [ -d crates/text ]; then
            cargo fmt -p wc-text -- --check
          else
            echo "crates/text not present yet, skipping"
          fi
