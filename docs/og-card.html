<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&display=swap" rel="stylesheet">
<style>
  /* Tokens mirror docs/DESIGN.md Part A ("black + orange"). Render at 1200x630. */
  :root {
    --bg: #0a0a0a;
    --sheet: #121212;
    --fg: #fafafa;
    --fg-2: #a3a3a3;
    --muted: #8c8c8c;
    --border: #242424;
    --accent: #f97316;
    --on-accent: #140a02;
    --accent-glow: rgba(249, 115, 22, .30);
    --red: #ef4444;
    --sans: "Geist", sans-serif;
    --serif: "Newsreader", Georgia, serif;
    --mono: "Geist Mono", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  /* the same orange bloom the hero has */
  .glow {
    position: absolute; inset: 0;
    background: radial-gradient(46% 58% at 82% 8%, var(--accent-glow), transparent 70%);
  }

  .card {
    position: absolute; inset: 0;
    padding: 62px 74px 58px;
    display: flex; flex-direction: column; justify-content: space-between;
  }

  .brand {
    display: flex; align-items: center; gap: 12px;
    font-weight: 700; font-size: 27px; letter-spacing: -.02em;
  }
  .brand svg { color: var(--accent); }

  h1 {
    font-family: var(--serif); font-weight: 400;
    font-size: 108px; line-height: .92; letter-spacing: -.035em;
  }
  h1 .it { font-style: italic; }
  .sub {
    margin-top: 22px; font-size: 25px; color: var(--fg-2); letter-spacing: -.01em;
  }

  .foot { display: flex; align-items: center; justify-content: space-between; gap: 24px; }

  .pricetag {
    display: inline-flex; align-items: center; gap: 14px;
    background: var(--sheet); border: 1px solid var(--border);
    border-radius: 999px; padding: 10px 10px 10px 24px;
    font-size: 20px; color: var(--fg-2);
  }
  .pricetag s { color: var(--muted); text-decoration-color: var(--red); text-decoration-thickness: 2px; }
  .pricetag b {
    background: var(--accent); color: var(--on-accent); font-weight: 600;
    padding: 10px 20px; border-radius: 999px; font-size: 20px;
  }

  .meta { font-family: var(--mono); font-size: 18px; color: var(--muted); text-align: right; line-height: 1.7; }
  .meta b { color: var(--fg-2); font-weight: 400; }
</style>
</head>
<body>
  <div class="glow"></div>

  <div class="card">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3.5"/>
      </svg>
      WhisprCatch
    </div>

    <div>
      <h1>You talk. <span class="it">It types.</span></h1>
      <p class="sub">Free, on-device dictation for macOS &amp; Linux. Nothing leaves your machine.</p>
    </div>

    <div class="foot">
      <div class="pricetag">
        Everyone else: <s>$12 to $25 a month</s> <b>This one: $0</b>
      </div>
      <div class="meta">open source, MIT<br><b>whisper-catch.vercel.app</b></div>
    </div>
  </div>
</body>
</html>
