<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fragment+Mono&family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&display=swap" rel="stylesheet">
<style>
  /* Tokens mirror docs/DESIGN.md Part A ("warm paper"). Render at 1200x630. */
  :root {
    --paper: #fcfbec;
    --paper-2: #fffef7;
    --paper-3: #f3f1de;
    --ink: #16191b;
    --ink-2: #545b57;
    --ink-3: #878d86;
    --rule: rgba(22, 25, 27, .12);
    --forest: #063c34;
    --on-forest: #eaf6f2;
    --mint: #5de8cd;
    --ember: #e4572e;
    --sans: "Figtree", sans-serif;
    --serif: "Newsreader", Georgia, serif;
    --mono: "Fragment Mono", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  /* the same mint bloom the hero has */
  .glow {
    position: absolute; inset: 0;
    background: radial-gradient(46% 58% at 82% 8%, rgba(93, 232, 205, .30), transparent 70%);
  }

  .card {
    position: absolute; inset: 0;
    padding: 62px 74px 58px;
    display: flex; flex-direction: column; justify-content: space-between;
  }

  .brand {
    display: flex; align-items: center; gap: 12px;
    font-weight: 700; font-size: 27px; letter-spacing: -.02em;
  }
  .brand svg { color: var(--forest); }

  h1 {
    font-family: var(--serif); font-weight: 400;
    font-size: 108px; line-height: .92; letter-spacing: -.035em;
  }
  h1 .it { font-style: italic; }
  .sub {
    margin-top: 22px; font-size: 25px; color: var(--ink-2); letter-spacing: -.01em;
  }

  .foot { display: flex; align-items: center; justify-content: space-between; gap: 24px; }

  .pricetag {
    display: inline-flex; align-items: center; gap: 14px;
    background: var(--paper-2); border: 1px solid var(--rule);
    border-radius: 999px; padding: 10px 10px 10px 24px;
    font-size: 20px; color: var(--ink-2);
  }
  .pricetag s { color: var(--ink-3); text-decoration-color: var(--ember); text-decoration-thickness: 2px; }
  .pricetag b {
    background: var(--forest); color: var(--on-forest); font-weight: 600;
    padding: 10px 20px; border-radius: 999px; font-size: 20px;
  }

  .meta { font-family: var(--mono); font-size: 18px; color: var(--ink-3); text-align: right; line-height: 1.7; }
  .meta b { color: var(--ink-2); font-weight: 400; }
</style>
</head>
<body>
  <div class="glow"></div>

  <div class="card">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3.5"/>
      </svg>
      WhisprCatch
    </div>

    <div>
      <h1>You talk. <span class="it">It types.</span></h1>
      <p class="sub">Free, on-device dictation for macOS &amp; Linux. Nothing leaves your machine.</p>
    </div>

    <div class="foot">
      <div class="pricetag">
        Everyone else: <s>$12 to $25 a month</s> <b>This one: $0</b>
      </div>
      <div class="meta">open source, MIT<br><b>whisper-catch.vercel.app</b></div>
    </div>
  </div>
</body>
</html>
